
name: Android APK Derleme

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Uygulamayı Derle ve APK Yükle
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Kaynak kodlarını indir
        uses: actions/checkout@v6

      - name: Java 17 kur
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle ortamını hazırla
        uses: gradle/actions/setup-gradle@v6

      - name: Gradle Wrapper dosyasını bul
        id: wrapper
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$(find . -type f -name gradlew \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            | sort | head -n 1)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::Gradle Wrapper (gradlew) bulunamadı. Android projesinin kaynak dosyalarını ve Gradle yapılandırmasını depoya ekle."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          chmod +x "$WRAPPER"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle projesi: $PROJECT_DIR"

      - name: Android APK derle
        working-directory: .
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.wrapper.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: APK dosyalarını doğrula
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.wrapper.outputs.project_dir }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          FOUND=0

          while IFS= read -r -d '' APK; do
            FOUND=1
            NAME="$(basename "$APK")"

            cp "$APK" "$GITHUB_WORKSPACE/apk-output/$NAME"
            echo "APK bulundu: $APK"
          done < <(
            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              -print0
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::Derleme tamamlandı fakat APK bulunamadı."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: APK dosyasını indirilebilir olarak yayımla
        uses: actions/upload-artifact@v4
        with:
          name: Jonni-Android-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
