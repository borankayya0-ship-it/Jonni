
name: Oda Sesli Arama APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android lisanslarını kabul et
        run: yes | sdkmanager --licenses || true

      - name: APK derle
        run: |
          if [ ! -f settings.gradle ] || [ ! -f app/build.gradle ]; then
            echo "HATA: Android proje dosyalari depoda bulunamadi."
            echo "Bu workflow tek basina Android uygulamasinin kaynak kodunu olusturmaz."
            exit 1
          fi
          gradle --no-daemon assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: OdaSesliArama-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
